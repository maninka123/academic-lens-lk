name: Build, check and deploy GitHub Pages
# Pushes and pull requests build and check the site, including the public-asset
# allowlist. Successful main pushes publish automatically; manual releases remain
# available through "Run workflow" on main. Pull requests never publish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import current editable dataset
        run: npm run data:import
      - name: Check public data allowlist
        run: node scripts/check-public-assets.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check built site for internal files and credentials
        run: node scripts/check-public-assets.mjs dist
      - name: Upload site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
